name: Test

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Superseded pull request runs are worth cancelling; runs on main are not,
# because each one is the only record for its commit.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go-version: "1.20", gvisor: true }
          - { os: ubuntu-latest, go-version: "1.21", gvisor: false }
          - { os: ubuntu-latest, go-version: "1.22", gvisor: false }
          - { os: ubuntu-latest, go-version: "1.23", gvisor: false }
          - { os: ubuntu-latest, go-version: "1.24", gvisor: false }
          - { os: ubuntu-latest, go-version: "1.25", gvisor: false }
          - { os: ubuntu-latest, go-version: "1.26", gvisor: true }
          - { os: windows-latest, go-version: "1.26", gvisor: false }
          - { os: macos-latest, go-version: "1.26", gvisor: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      MSYS_NO_PATHCONV: true
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Go installation
        run: go version

      - name: Remove inbound tests on macOS
        if: ${{ runner.os == 'macOS' }}
        run: rm -f listener/inbound/*_test.go

      - name: Test
        run: go test ./... -count=1

      - name: Test with gVisor
        if: ${{ matrix.gvisor }}
        run: go test ./... -count=1 -tags "with_gvisor"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: golangci-lint run --timeout=10m

      # The interop suite is a separate module, so the job above never reaches it
      # and it silently rots.
      - name: Lint interop test module
        working-directory: test
        run: golangci-lint run --timeout=10m

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"

      # -count=1 keeps a re-run from being served a cached pass. It matters more
      # here than elsewhere because races surface intermittently, so re-running
      # is exactly how one gets caught.
      - name: Targeted race tests
        run: >-
          go test -race -count=1
          ./common/net
          ./component/aster
          ./hub/route
          ./listener
          ./listener/anytls
          ./listener/shadowsocks
          ./listener/sing_vless
          ./listener/sing_vmess
          ./listener/trojan
          ./transport/snell
          ./transport/vless
          ./tunnel/statistic
