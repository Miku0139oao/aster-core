version: "2"

run:
  go: "1.20"

linters:
  default: none
  enable:
    - govet
    - staticcheck
  settings:
    govet:
      disable:
        - inline
    staticcheck:
      checks:
        - "SA*"
        - "ST1005"
        - "-SA1019"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/Miku0139oao/aster-core)
        - default
